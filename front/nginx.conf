server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html =404;
    }

    location /api/ {
        proxy_pass http://server:8080/;
        proxy_set_header Host $host;
    }

    location /client.apk {
        alias /shared/client.apk;
    }

    location /shared/ {
        alias /shared/;
        autoindex on;
    }
}
